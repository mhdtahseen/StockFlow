# .github/workflows/catalog-update.yml
#
# Runs every Friday at 2:00 AM IST (Thursday 8:30 PM UTC)
# Can also be triggered manually from the Actions tab.
#
# Required GitHub Secrets  (Settings → Secrets → Actions):
#   SUPABASE_URL          → https://your-project-id.supabase.co
#   SUPABASE_SERVICE_KEY  → service_role key (NOT the anon key)
#
# ONE-TIME BACKFILL:
#   Trigger manually → set max_pages = "5"
#   This scrapes up to 5 pages per brand to populate the DB fully.
#   After that, leave max_pages at "1" for all future runs.

name: 📱 Weekly Device Catalog Update

on:
  schedule:
    - cron: "30 20 * * 4" # Thursday 20:30 UTC = Friday 02:00 IST

  workflow_dispatch: # Manual trigger from GitHub UI
    inputs:
      force_rescrape:
        description: "Force re-scrape all devices (ignores complete flag)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

      max_pages:
        description: "Pages to scrape per brand (1 = normal weekly, 5 = one-time backfill)"
        required: false
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]

jobs:
  update-catalog:
    name: Scrape & Update catalog_models_v2
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 5 hour cap

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: scrapper-test # always run against scrapper-test branch
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      # ── 3. Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # ── 4. Run scraper ───────────────────────────────────────────────────
      - name: Run catalog scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RESCRAPE: ${{ github.event.inputs.force_rescrape || 'false' }}
          SCRAPE_MAX_PAGES: ${{ github.event.inputs.max_pages || '1' }}
        run: |
          cd scraper
          python scrape.py 2>&1 | tee ../scraper_run.log
        continue-on-error: false

      # ── 5. Upload log as artifact (visible in Actions tab) ───────────────
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper_run.log
          retention-days: 30

      # ── 6. Post summary to Actions UI ────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 📱 Catalog Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Pages scraped per brand:** \`${{ github.event.inputs.max_pages || '1' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 scraper_run.log >> $GITHUB_STEP_SUMMARY || echo "No log available"
          echo '```' >> $GITHUB_STEP_SUMMARY
